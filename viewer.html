<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>treemap://atlas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <div class="row1"><h1><a href="index.html"><span class="proto">treemap://</span><span id="dsid">...</span></a></h1></div>
  <div class="row2"><span class="tag" id="dsmeta"></span></div>
</header>
<div class="controls">
  <span class="cgroup"><span class="clabel">view</span><span class="seg"><button id="bMap" class="on">map</button><button id="bBars">bars</button><button id="bTable">table</button></span></span>
  <span class="cgroup"><span class="clabel">color</span><span class="seg"><button id="bFlat">flat</button><button id="bCat" class="on">category</button></span><span id="legend"></span></span>
  <span class="cgroup"><span class="clabel">layout</span><span class="seg"><button id="bGroup" class="on">grouped</button><button id="bUngroup">flat</button></span></span>
  <span class="cgroup nav"><span class="meta" id="zoomlabel">zoom 1.0x</span><button id="bReset">reset</button></span>
  <span id="howto" title="">?</span>
</div>
<div class="controls" id="timebar" style="display:none">
  <button id="bPlay">play</button>
  <button id="bAbs" title="treemap area scales with the year's total">absolute scale</button>
  <input type="range" id="yslider" min="0" max="0" value="0">
  <span class="meta" id="ylabel"></span>
</div>
<div id="stage">
  <div id="yearoverlay"></div>
  <canvas id="cv"></canvas>
  <div id="tooltip"></div>
  <div id="tablewrap" style="display:none"></div>
  <div id="barswrap" style="display:none"></div>
</div>
<div id="caption"></div>
<script type="module">
import { Treemap } from './treemap-engine.js';

const id = new URLSearchParams(location.search).get('d') || 'population';
const [reg, data] = await Promise.all([
  fetch('datasets/index.json').then(r => r.json()),
  fetch(`datasets/${id}.json`).then(r => r.json())
]);
const entry = reg.datasets.find(d => d.id === id) || {};
document.getElementById('dsid').textContent = id;

document.title = `treemap://${id}`;
const total = data.items.reduce((s, d) => s + d.value, 0);
const cap = document.getElementById('caption');
const yov = document.getElementById('yearoverlay');
function setCaption(y) {
  cap.innerHTML = `<b>${data.title}</b> \u2014 ${data.items.length} items, measured in ${data.unit}. Source: <a class="srclink" href="${data.source_url || '#'}" target="_blank" rel="noopener">${data.source}</a>`;
  yov.textContent = y || data.date || '';
}
setCaption(data.years ? data.years[data.years.length - 1] : data.date);
const grouped = data.items.some(d => d.parent);
document.getElementById('howto').title =
  'How to read: area = value in ' + data.unit + ', sorted big to small from top left' +
  (grouped ? ', grouped in labeled blocks (click a block to zoom)' : '') + '. Hover any rectangle for details.';
document.getElementById('dsmeta').innerHTML =
  `${data.items.length} items \u00b7 ${fmtTotal(total)} ${data.unit} \u00b7 data: <a class="srclink" href="${data.source_url || '#'}" target="_blank" rel="noopener">${data.source}</a>`;

function fmtTotal(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString();
}

const cv = document.getElementById('cv');
const tm = new Treemap(cv, data);
const tip = document.getElementById('tooltip');

tm.onHover = (n, x, y) => {
  if (!n) { tip.style.display = 'none'; return; }
  const pct = (100 * n.value / total).toFixed(3);
  const rank = tm.rank.get(n);
  const grp = n.parent ? `<span class="k">group</span> ${n.parent}<br>` : '';
  const note = n.note ? `<span class="k">in</span> ${n.note}<br>` : '';
  tip.innerHTML = `<b>${n.name}</b><br>`
    + `<span class="k">value</span> ${fmtTotal(n.value)} ${data.unit}<br>`
    + `<span class="k">share</span> ${pct}%<br>`
    + `<span class="k">rank</span> ${rank} of ${tm.n}<br>`
    + note + grp
    + `<span class="k">source</span> ${data.source}`;
  tip.style.display = 'block';
  const tw2 = tip.offsetWidth || 180, th2 = tip.offsetHeight || 90;
  tip.style.left = Math.max(0, Math.min(x + 14, cv.clientWidth - tw2 - 4)) + 'px';
  tip.style.top = Math.max(0, Math.min(y + 14, cv.clientHeight - th2 - 4)) + 'px';
};
tm.onZoom = s => document.getElementById('zoomlabel').textContent = `zoom ${s.toFixed(1)}x`;

const bFlat = document.getElementById('bFlat');
const bCat = document.getElementById('bCat');
bFlat.onclick = () => { tm.setColorMode('flat'); bFlat.classList.add('on'); bCat.classList.remove('on'); };
bCat.onclick = () => { tm.setColorMode('category'); bCat.classList.add('on'); bFlat.classList.remove('on'); };
const bGroup = document.getElementById('bGroup');
const bUngroup = document.getElementById('bUngroup');
function setGroupUI(g) {
  bGroup.classList.toggle('on', g);
  bUngroup.classList.toggle('on', !g);
  tm.setGrouped(g);
}
bGroup.onclick = () => setGroupUI(true);
bUngroup.onclick = () => setGroupUI(false);
const hasGroups = data.items.some(d => d.parent);
if (!hasGroups) { bGroup.disabled = true; bUngroup.classList.add('on'); bGroup.classList.remove('on'); }
document.getElementById('bReset').onclick = () => tm.reset();

const tw = document.getElementById('tablewrap');
const bTable = document.getElementById('bTable');
let tableOn = false, sortKey = 'value', sortDir = -1;
function renderTable() {
  const rows = [...data.items].map(d => ({
    name: d.name, value: d.value, share: 100 * d.value / total,
    group: d.parent || '', rank: tm.rank.get(d) || 0
  }));
  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir;
  });
  const hasGroup = rows.some(r => r.group);
  const cols = [['rank', '#'], ['name', 'name'], ['value', `value (${data.unit})`], ['share', 'share']];
  if (hasGroup) cols.push(['group', 'group']);
  const arrow = k => sortKey === k ? (sortDir < 0 ? ' \u2193' : ' \u2191') : '';
  tw.innerHTML = `<table class="dt"><thead><tr>` +
    cols.map(([k, l]) => `<th data-k="${k}">${l}${arrow(k)}</th>`).join('') +
    `</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r.rank}</td><td>${r.name}</td><td>${fmtTotal(r.value)}</td><td>${r.share.toFixed(2)}%</td>` +
      (hasGroup ? `<td>${r.group}</td>` : '') + `</tr>`).join('') +
    `</tbody></table>`;
  tw.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'name' || k === 'group' ? 1 : -1; }
    renderTable();
  });
}
if (data.years && data.years.length > 1) {
  const bar = document.getElementById('timebar');
  const sl = document.getElementById('yslider');
  const yl = document.getElementById('ylabel');
  const bPlay = document.getElementById('bPlay');
  bar.style.display = 'flex';
  sl.max = data.years.length - 1;
  sl.value = data.years.length - 1;
  yl.textContent = data.years[data.years.length - 1];
  let playing = null;
  const setY = i => {
    yl.textContent = data.years[i];
    yov.textContent = data.years[i];
    tm.setYear(i);
    if (view === 'table') renderTable();
    if (view === 'bars') renderBars();
  };
  sl.oninput = () => { setY(+sl.value); };
  const bAbs = document.getElementById('bAbs');
  bAbs.onclick = () => {
    const on = !bAbs.classList.contains('on');
    bAbs.classList.toggle('on', on);
    tm.setAbsolute(on);
    if (on && +sl.value === data.years.length - 1) {
      sl.value = 0;
      setY(0);
    }
  };
  bPlay.onclick = () => {
    if (playing) { clearInterval(playing); playing = null; bPlay.textContent = 'play'; bPlay.classList.remove('on'); return; }
    if (+sl.value >= data.years.length - 1) sl.value = 0;
    bPlay.textContent = 'stop'; bPlay.classList.add('on');
    playing = setInterval(() => {
      if (+sl.value >= data.years.length - 1) { clearInterval(playing); playing = null; bPlay.textContent = 'play'; bPlay.classList.remove('on'); return; }
      sl.value = +sl.value + 1;
      setY(+sl.value);
    }, 650);
  };
}

const bMap = document.getElementById('bMap');
const bBars = document.getElementById('bBars');
const bw = document.getElementById('barswrap');
let view = 'map';
function setView(v) {
  view = v;
  tableOn = v === 'table';
  bMap.classList.toggle('on', v === 'map');
  bBars.classList.toggle('on', v === 'bars');
  bTable.classList.toggle('on', v === 'table');
  cv.style.display = v === 'map' ? 'block' : 'none';
  tw.style.display = v === 'table' ? 'block' : 'none';
  bw.style.display = v === 'bars' ? 'block' : 'none';
  yov.style.display = v === 'table' ? 'none' : 'block';
  tip.style.display = 'none';
  if (v === 'table') renderTable();
  if (v === 'bars') renderBars();
}
bMap.onclick = () => setView('map');
bBars.onclick = () => setView('bars');
bTable.onclick = () => setView('table');

let barsBuilt = false;
function renderBars() {
  const rows = [...data.items].filter(d => d.value > 0).sort((a, b) => b.value - a.value).slice(0, 60);
  const max = rows[0] ? rows[0].value : 1;
  if (!barsBuilt) {
    bw.innerHTML = '<div class="barlist">' + rows.map(() =>
      `<div class="barrow"><span class="bname"></span><span class="btrack"><span class="bfill"></span></span><span class="bval"></span></div>`).join('') + '</div>';
    barsBuilt = true;
  }
  const rowEls = bw.querySelectorAll('.barrow');
  rows.forEach((d, i) => {
    const el = rowEls[i];
    if (!el) return;
    el.querySelector('.bname').textContent = `${i + 1}. ${d.name}`;
    const f = el.querySelector('.bfill');
    f.style.width = (100 * d.value / max) + '%';
    f.style.background = tm.colorMode === 'flat' ? '#0a3069' : (tm.catColor.get(d.color_key || '') || '#64748b');
    el.querySelector('.bval').textContent = fmtTotal(d.value) + ' (' + (100 * d.value / total).toFixed(1) + '%)';
  });
}
const lg = document.getElementById('legend');
function buildLegend() {
  lg.innerHTML = '';
  if (tm.colorMode === 'flat') return;
  for (const [cat, col] of tm.catColor) {
    const e = document.createElement('span');
    e.className = 'lg';
    const pct = (100 * (tm.catTotal.get(cat) || 0) / total).toFixed(1);
    e.innerHTML = `<span class="sw" style="background:${col}"></span>${cat} <span class="lp">${pct}%</span>`;
    lg.appendChild(e);
  }
}
buildLegend();
const oldFlat = bFlat.onclick, oldCat = bCat.onclick;
bFlat.onclick = () => { oldFlat(); buildLegend(); };
bCat.onclick = () => { oldCat(); buildLegend(); };
addEventListener('resize', () => tm.resize());
requestAnimationFrame(() => tm.resize());
</script>
</body>
</html>
