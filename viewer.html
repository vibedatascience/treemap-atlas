<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>treemap://atlas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <h1><a href="index.html"><span class="proto">treemap://</span><span id="dsid">...</span></a></h1>
  <span class="tag" id="dsmeta"></span>
</header>
<div class="controls">
  <button id="bFlat">flat colors</button>
  <button id="bCat" class="on">color by category</button>
  <button id="bGroup" class="on">group by category</button>
  <button id="bReset">reset view</button>
  <button id="bTable">table view</button>
  <span id="legend"></span><span class="meta" id="zoomlabel">zoom 1.0x</span>
</div>
<div class="controls" id="timebar" style="display:none">
  <button id="bPlay">play</button>
  <input type="range" id="yslider" min="0" max="0" value="0">
  <span class="meta" id="ylabel"></span>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="tooltip"></div>
  <div id="tablewrap" style="display:none"></div>
</div>
<script type="module">
import { Treemap } from './treemap-engine.js';

const id = new URLSearchParams(location.search).get('d') || 'population';
const [reg, data] = await Promise.all([
  fetch('datasets/index.json').then(r => r.json()),
  fetch(`datasets/${id}.json`).then(r => r.json())
]);
const entry = reg.datasets.find(d => d.id === id) || {};
document.getElementById('dsid').textContent = id;
document.title = `treemap://${id}`;
const total = data.items.reduce((s, d) => s + d.value, 0);
document.getElementById('dsmeta').innerHTML =
  `${data.items.length} items \u00b7 ${fmtTotal(total)} ${data.unit} \u00b7 data: <a class="srclink" href="${data.source_url || '#'}" target="_blank" rel="noopener">${data.source}</a>`;

function fmtTotal(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString();
}

const cv = document.getElementById('cv');
const tm = new Treemap(cv, data);
const tip = document.getElementById('tooltip');

tm.onHover = (n, x, y) => {
  if (!n) { tip.style.display = 'none'; return; }
  const pct = (100 * n.value / total).toFixed(3);
  const rank = tm.rank.get(n);
  const grp = n.parent ? `<span class="k">group</span> ${n.parent}<br>` : '';
  const note = n.note ? `<span class="k">in</span> ${n.note}<br>` : '';
  tip.innerHTML = `<b>${n.name}</b><br>`
    + `<span class="k">value</span> ${fmtTotal(n.value)} ${data.unit}<br>`
    + `<span class="k">share</span> ${pct}%<br>`
    + `<span class="k">rank</span> ${rank} of ${tm.n}<br>`
    + note + grp
    + `<span class="k">source</span> ${data.source}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(x + 14, cv.clientWidth - 180) + 'px';
  tip.style.top = (y + 14) + 'px';
};
tm.onZoom = s => document.getElementById('zoomlabel').textContent = `zoom ${s.toFixed(1)}x`;

const bFlat = document.getElementById('bFlat');
const bCat = document.getElementById('bCat');
bFlat.onclick = () => { tm.setColorMode('flat'); bFlat.classList.add('on'); bCat.classList.remove('on'); };
bCat.onclick = () => { tm.setColorMode('category'); bCat.classList.add('on'); bFlat.classList.remove('on'); };
const bGroup = document.getElementById('bGroup');
bGroup.onclick = () => { const g = !bGroup.classList.contains('on'); bGroup.classList.toggle('on', g); tm.setGrouped(g); };
document.getElementById('bReset').onclick = () => tm.reset();

const tw = document.getElementById('tablewrap');
const bTable = document.getElementById('bTable');
let tableOn = false, sortKey = 'value', sortDir = -1;
function renderTable() {
  const rows = [...data.items].map(d => ({
    name: d.name, value: d.value, share: 100 * d.value / total,
    group: d.parent || '', rank: tm.rank.get(d) || 0
  }));
  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir;
  });
  const hasGroup = rows.some(r => r.group);
  const cols = [['rank', '#'], ['name', 'name'], ['value', `value (${data.unit})`], ['share', 'share']];
  if (hasGroup) cols.push(['group', 'group']);
  const arrow = k => sortKey === k ? (sortDir < 0 ? ' \u2193' : ' \u2191') : '';
  tw.innerHTML = `<table class="dt"><thead><tr>` +
    cols.map(([k, l]) => `<th data-k="${k}">${l}${arrow(k)}</th>`).join('') +
    `</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r.rank}</td><td>${r.name}</td><td>${fmtTotal(r.value)}</td><td>${r.share.toFixed(2)}%</td>` +
      (hasGroup ? `<td>${r.group}</td>` : '') + `</tr>`).join('') +
    `</tbody></table>`;
  tw.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'name' || k === 'group' ? 1 : -1; }
    renderTable();
  });
}
if (data.years && data.years.length > 1) {
  const bar = document.getElementById('timebar');
  const sl = document.getElementById('yslider');
  const yl = document.getElementById('ylabel');
  const bPlay = document.getElementById('bPlay');
  bar.style.display = 'flex';
  sl.max = data.years.length - 1;
  sl.value = data.years.length - 1;
  yl.textContent = data.years[data.years.length - 1];
  let playing = null;
  const setY = i => {
    yl.textContent = data.years[i];
    tm.setYear(i);
    if (tableOn) renderTable();
  };
  sl.oninput = () => { setY(+sl.value); };
  bPlay.onclick = () => {
    if (playing) { clearInterval(playing); playing = null; bPlay.textContent = 'play'; bPlay.classList.remove('on'); return; }
    if (+sl.value >= data.years.length - 1) sl.value = 0;
    bPlay.textContent = 'stop'; bPlay.classList.add('on');
    playing = setInterval(() => {
      if (+sl.value >= data.years.length - 1) { clearInterval(playing); playing = null; bPlay.textContent = 'play'; bPlay.classList.remove('on'); return; }
      sl.value = +sl.value + 1;
      setY(+sl.value);
    }, 650);
  };
}

bTable.onclick = () => {
  tableOn = !tableOn;
  bTable.classList.toggle('on', tableOn);
  bTable.textContent = tableOn ? 'map view' : 'table view';
  cv.style.display = tableOn ? 'none' : 'block';
  tw.style.display = tableOn ? 'block' : 'none';
  tip.style.display = 'none';
  if (tableOn) renderTable();
};
const lg = document.getElementById('legend');
function buildLegend() {
  lg.innerHTML = '';
  if (tm.colorMode === 'flat') return;
  for (const [cat, col] of tm.catColor) {
    const e = document.createElement('span');
    e.className = 'lg';
    e.innerHTML = `<span class="sw" style="background:${col}"></span>${cat}`;
    lg.appendChild(e);
  }
}
buildLegend();
const oldFlat = bFlat.onclick, oldCat = bCat.onclick;
bFlat.onclick = () => { oldFlat(); buildLegend(); };
bCat.onclick = () => { oldCat(); buildLegend(); };
addEventListener('resize', () => tm.resize());
</script>
</body>
</html>
